<title>Mystery at the Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&family=VT323&display=swap">
<style>
/* Layout: one game stage under a level track; the printed artwork sits in chunky board-game frames with ink outlines and hard offset shadows, on mustard paper like the box cover */
:root{
  --paper:#FBE7A6; --dot:#EFCB63; --sun:#F5C22B; --ink:#2A1538; --plum:#5B1E5F; --card:#FFFDF6; --muted:#6B5876;
  --l1:#F5C22B; --l2:#5A9BEA; --l3:#8CCB2E; --l4:#EE6A66;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --cam:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.5;font-weight:600;
  background:var(--paper) radial-gradient(var(--dot) 1.3px,transparent 1.4px) 0 0/22px 22px}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:3px solid var(--plum);outline-offset:3px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{font-family:var(--display);font-size:1.4rem;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand img{width:34px;height:34px;object-fit:contain}
.track{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);font-weight:900;font-size:.85rem;cursor:pointer}
.step .dot{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:.85rem}
.step[aria-current="step"]{background:var(--c);box-shadow:2px 2px 0 var(--ink)}
.step .lbl{display:none}
@media (min-width:860px){.step .lbl{display:inline}}

.btn{font-family:var(--display);font-size:1.12rem;letter-spacing:.02em;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:.5em 1.25em;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:.45em;justify-content:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.lv{background:var(--lv)}
.btn.small{font-size:.95rem;padding:.35em .9em}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn svg{width:1.1em;height:1.1em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:900;background:var(--card)}
.chip img{width:28px;height:28px;object-fit:contain}
.eyebrow{font-weight:900;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--plum)}
.msg{font-size:1.08rem;font-weight:800;min-height:1.6em}
.msg.good{color:#2D6B26}
.msg.bad{color:#A3262B}
.hint{font-size:.92rem;color:var(--muted)}

/* title */
.hero{display:grid;gap:0;overflow:hidden;grid-template-columns:1fr}
@media (min-width:820px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.hero .art{background:var(--sun);border-bottom:3px solid var(--ink);display:grid;place-items:center}
@media (min-width:820px){.hero .art{border-bottom:0;border-right:3px solid var(--ink)}}
.hero .art img{width:100%;height:100%;object-fit:cover;max-height:560px}
.hero .copy{padding:clamp(20px,3.5vw,36px);display:grid;gap:18px;align-content:center}
.hero .lede{font-size:1.18rem;font-weight:800;max-width:30em}
.toyrow{display:flex;gap:6px;flex-wrap:wrap;align-items:end}
.toyrow img{height:52px;width:auto}
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opt{padding:16px 18px;display:grid;gap:10px;align-content:start}
.seg{display:inline-flex;justify-self:start;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 14px;font-weight:900;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.credit{font-size:.88rem;color:var(--muted);max-width:62em}

/* intro card */
.intro{max-width:880px;margin:0 auto;width:100%;overflow:hidden}
.intro .band{background:var(--lv);border-bottom:3px solid var(--ink);padding:18px 22px;display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
.intro .band h2{font-size:clamp(1.8rem,5vw,2.6rem)}
.intro .body{padding:22px;display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.intro .body{grid-template-columns:150px minmax(0,1fr)}}
.intro .joker{width:150px;max-width:40%;border-radius:12px}
@media (max-width:699px){.intro .joker{display:none}}
.letter{display:grid;gap:12px;align-content:start}
.letter .story{font-size:clamp(1.12rem,2.5vw,1.3rem);line-height:1.55;max-width:36em}
.letter .sign{font-style:italic}
details.notes{border:2px dashed var(--muted);border-radius:12px;padding:10px 14px}
details.notes summary{cursor:pointer;font-weight:900}
details.notes ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:4px}

/* play area */
.playhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.playhead h2{font-size:clamp(1.5rem,4vw,2.1rem)}
.task{font-size:1.12rem;font-weight:800;max-width:48em}

/* level 1 */
.photos{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.photos{grid-template-columns:1fr 1fr}}
.cam{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#1d1622;box-shadow:4px 4px 0 var(--ink)}
.camlab{font-family:var(--cam);font-size:1.25rem;color:#9CF29A;padding:2px 10px;display:flex;justify-content:space-between;letter-spacing:.04em;background:#1d1622}
.shot{position:relative;cursor:crosshair}
.shot img{width:100%;height:auto}
.shot .hit{position:absolute;border:0;background:transparent;padding:0;cursor:crosshair}
.shot .box{position:absolute;border:4px solid #E0464B;border-radius:6px;box-shadow:0 0 0 3px rgba(255,255,255,.8);animation:pop .5s ease-out;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:scale(1)}}

/* level 2 */
.l2top{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.l2top{grid-template-columns:230px minmax(0,1fr)}}
.silcam{border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:#1d1622;align-self:start}
.silcam .view{position:relative;background:#B7B3C2;display:grid;place-items:center;padding:10px}
.silcam .view::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px);pointer-events:none}
.silcam .view img{max-height:300px;width:auto;max-width:100%;filter:blur(1.2px) contrast(1.2) brightness(.7);mix-blend-mode:multiply}
.witness{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-content:start}
.tcard{border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);overflow:hidden;display:grid}
.tcard img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center;border-bottom:2.5px solid var(--ink)}
.tcard .tx{padding:8px 10px;display:grid;gap:2px}
.tcard .who{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--plum)}
.tcard .say{font-size:1rem;font-weight:900;line-height:1.3}
.tcard.wait{border-style:dashed;box-shadow:none;place-items:center;min-height:150px;color:var(--muted);font-weight:900;background:repeating-linear-gradient(45deg,var(--card) 0 10px,#EEF3FB 10px 20px)}
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.person{position:relative;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0;overflow:hidden;transition:transform .12s,opacity .12s}
.person img{width:100%;height:auto}
.person .cm{font-family:var(--cam);font-size:.95rem;color:var(--muted);background:var(--card);border-top:2px solid var(--ink);padding:1px 0}
.person[aria-pressed="true"]{opacity:.5;transform:rotate(-3deg) scale(.96)}
.person[aria-pressed="true"]::after{content:"Set aside";position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--display);font-size:1.2rem;border:3px solid #A3262B;color:#A3262B;padding:0 8px;border-radius:6px;background:rgba(255,253,246,.88)}
.person.owner{outline:5px solid var(--l2);outline-offset:2px}
.pile{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--muted)}
.ask{padding:16px 18px;display:grid;gap:12px}
.ask .q{font-family:var(--display);font-size:1.5rem}
.envs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.env{width:92px;height:62px;border:3px solid var(--ink);border-radius:6px;position:relative;box-shadow:3px 3px 0 var(--ink)}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,var(--ink) 49% 52%,transparent 52%),linear-gradient(to bottom left,transparent 49%,var(--ink) 49% 52%,transparent 52%);background-size:100% 60%;background-repeat:no-repeat}

/* boards (levels 3 and 4) */
.l3{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:1000px){.l3{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.board{border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);background:var(--card);overflow:auto;align-self:start}
.board svg{display:block;width:100%;min-width:640px;height:auto}
.ctr{transition:transform .32s ease-in-out}
.ctr .arrow{transition:transform .25s}
.ctr.bump{animation:bump .45s}
@keyframes bump{30%{opacity:.3}60%{opacity:1}80%{opacity:.4}}
.tilehit{cursor:pointer}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.side{display:grid;gap:14px;align-content:start}
.box{padding:14px 16px;display:grid;gap:10px}
.box h3{font-size:1.2rem}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{position:relative;border:0;background:none;padding:0;display:grid;justify-items:center;gap:4px;cursor:pointer;font-weight:900;font-size:.8rem;line-height:1.1}
.mcard img{width:100%;max-width:74px;border-radius:8px;box-shadow:3px 3px 0 var(--ink);transition:transform .25s}
.mcard .ct{position:absolute;top:-8px;right:-4px;background:var(--card);border:2px solid var(--ink);border-radius:999px;font-size:.75rem;padding:0 6px;font-variant-numeric:tabular-nums}
.mcard:disabled{opacity:.4;cursor:not-allowed}
.strip{display:flex;flex-wrap:wrap;gap:6px;min-height:62px;padding:8px;border:2.5px dashed #F08A2B;border-radius:12px;align-content:flex-start;background:#FFF6EC}
.strip .empty{color:var(--muted);font-weight:800;align-self:center}
.strip .startc{width:46px;height:46px;border-radius:6px}
.pcard{border:0;background:none;width:46px;height:46px;position:relative;cursor:pointer;padding:0}
.pcard img{width:46px;height:46px;border-radius:6px;transition:transform .25s}
.pcard .i{position:absolute;bottom:-3px;left:-3px;font-size:.62rem;font-weight:900;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:0 4px;line-height:1.3}
.pcard.now{transform:translateY(-4px)}
.pcard.now img{box-shadow:0 0 0 3px var(--ink)}
.facing{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.facing button{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:10px;background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.facing button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.facing svg{width:20px;height:20px}
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clue{border-radius:10px;overflow:hidden;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);aspect-ratio:3/4;background:#8CCB2E repeating-linear-gradient(45deg,transparent 0 8px,rgba(42,21,56,.12) 8px 16px);display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;color:var(--ink)}
.clue img{width:100%;height:100%;object-fit:cover}
.toggle{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.92rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--plum)}

/* level 4 */
.tokens{display:flex;gap:10px;flex-wrap:wrap}
.tok{position:relative;width:54px}
.tok img{width:54px;border-radius:6px}
.tok b{position:absolute;bottom:-6px;right:-6px;background:var(--card);border:2px solid var(--ink);border-radius:999px;font-size:.8rem;padding:0 7px;font-variant-numeric:tabular-nums}
.tok.zero img{opacity:.3;filter:grayscale(1)}
.diebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.die{width:68px;height:68px;border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.die svg{width:100%;height:100%;display:block}
.lookfor{display:flex;gap:12px;align-items:center}
.lookfor img{width:76px;border:2.5px solid var(--ink);border-radius:10px;flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(42,21,56,.6);display:grid;place-items:center;padding:16px;overflow:auto;z-index:20}
.modal{width:min(620px,100%);overflow:hidden}
.modal.wide{width:min(980px,100%)}
.modal .band{background:var(--mc,var(--sun));border-bottom:3px solid var(--ink);padding:14px 18px}
.modal .band h3{font-size:1.6rem}
.modal .body{padding:18px;display:grid;gap:14px}
.quizimg{width:100%;height:auto;border-radius:10px;border:2px solid #ddd}
.answer{border:3px dashed var(--ink);border-radius:12px;padding:12px 14px;background:#FFF8DA;display:grid;gap:8px}
.answer .key{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;word-break:break-word}
.answer img{max-width:100%;max-height:300px;width:auto;border-radius:8px;background:#fff}
.bigclue{width:min(200px,60%);margin:0 auto;border-radius:12px;box-shadow:4px 4px 0 var(--ink);border:3px solid var(--ink)}
.algo{margin:0;padding-left:1.4em;display:grid;gap:2px;font-size:1.1rem;font-weight:800}

/* win */
.win{padding:clamp(20px,4vw,40px);display:grid;gap:18px;text-align:center;justify-items:center;background:var(--sun)}
.win h2{font-size:clamp(2.4rem,7vw,4rem)}
.win .pair{display:flex;gap:16px;align-items:end;justify-content:center}
.win .pair .p{width:150px;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.win .pair .t{width:110px}
.skills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- helpers ---------- */
const R = n => Math.floor(Math.random() * n);
const pick = a => a[R(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = (x, y) => x + ',' + y;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);

}
const ICON = {

};

function roadTiles() { const t = []; for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) if (CITY[y][x] === 'P' && !(x === START3.x && y === START3.y)) t.push({ x, y }); return t; }

/* ---------- flow ---------- */
function ensurePrereqs(n) {
  if (n >= 1 && !S.toy) S.toy = pick(Object.keys(TOYS));
  if (n >= 2 && !S.owner) S.owner = newL2().owner;
  if (n >= 3 && !S.ownerDoor) S.ownerDoor = pick(DOOR_COLS);
  if (n >= 3 && !S.l3) S.l3 = newL3();
}
function goto(n) {
  ensurePrereqs(n);
  S.level = n; S.screen = 'intro'; S.modal = null;
  if (n === 0) S.l1 = newL1();
  if (n === 1) S.l2 = newL2();
  if (n === 2) S.l3 = newL3();
  if (n === 3) S.l4 = newL4();
  render(); window.scrollTo(0, 0);
}
const ACT = {
  home() { S.screen = 'title'; S.modal = null; render(); },
  new() { const hard = S.hard, check = S.check, seen = S.seen1; S = freshState(); S.hard = hard; S.check = check; S.seen1 = seen; goto(0); },
  goto(a) { goto(+a); },
  hard(a) { S.hard = a === '1'; if (S.screen === 'intro' && S.level === 0) S.l1 = newL1(); render(); },
  speak() { const L = LEVELS[S.level]; speak((L.letter ? L.letter.join(' ') + ' ' + L.sign + '. ' : '') + L.story); },
  play() { S.screen = 'play'; render(); window.scrollTo(0, 0); },
  close() { S.modal = null; render(); },
  finish(a) { const n = +a; S.done[n] = true; S.modal = { type: 'done', level: n }; render(); },

  l1new() { S.l1 = newL1(); render(); },
  l1hit() { const l1 = S.l1; if (l1.found) return; l1.found = true; S.toy = L1CARDS[l1.n][0]; render(); },
  l1miss() { const l1 = S.l1; if (l1.found) return; l1.misses++; l1.flash = 1; render(); },

  l2tap(a) { const l2 = S.l2; if (l2.phase !== 'sort') return; l2.aside[a] = !l2.aside[a]; l2.msg = ''; render(); },
  l2check() {
    const l2 = S.l2, k = l2.shown;
    const visible = l2.cards.filter(c => failsAt(c.id, l2) > k - 1);
    const should = visible.filter(c => failsAt(c.id, l2) === k), keep = visible.filter(c => failsAt(c.id, l2) > k);
    const wrong = keep.filter(c => l2.aside[c.id]), missing = should.filter(c => !l2.aside[c.id]);
    const names = l => l.map(c => person(c.id).name).join(' and ');
    if (wrong.length) { l2.msg = `Look again at ${names(wrong)}. ${wrong.length > 1 ? 'They still match' : 'That person still matches'} ${k === 0 ? 'the shadow' : 'every clue so far'}.`; l2.msgType = 'bad'; }
    else if (missing.length) { l2.msg = `Nearly! ${missing.length} ${missing.length > 1 ? 'people' : 'person'} left on the table ${k === 0 ? 'don’t match the shadow' : 'don’t fit the testimony'}. Keep looking.`; l2.msgType = 'bad'; }
    else {
      l2.aside = {}; l2.msgType = 'good';
      if (keep.length === 1) { l2.phase = 'done'; S.owner = l2.owner; S.ownerDoor = pick(DOOR_COLS); S.l3 = null; l2.msg = ''; }
      else { l2.phase = 'ask'; l2.msg = k === 0 ? `Well done! ${keep.length} people match the shadow.` : `Well done! ${keep.length} people still fit the clues.`; }
    }
    render();
  },
  l2more() { const l2 = S.l2; l2.shown++; l2.phase = 'sort'; l2.msg = ''; l2.msgType = ''; render(); },
  l2nomore() { const l2 = S.l2, n = l2.cards.filter(c => failsAt(c.id, l2) > l2.shown).length; l2.msg = `There are still ${n} people who could be the owner. We need another testimony to be sure.`; l2.msgType = 'bad'; render(); },

  l3place(a) { const l3 = S.l3; if (!l3.setup) return; const [x, y] = a.split(',').map(Number); if (l3.museums.some(m => m.x === x && m.y === y)) return; l3.museums[l3.placeNext] = { x, y, done: false }; l3.placeNext = (l3.placeNext + 1) % 3; render(); },
  l3shuffle() { S.l3.museums = randomMuseums(); render(); },
  l3begin() { const l3 = S.l3; l3.setup = false; l3.msg = 'The toy is on START, facing left. Build your first algorithm with the move cards.'; render(); },
  l3restart() { const l3 = S.l3; l3.museums.forEach(m => m.done = false); l3.clues = []; l3.digits = shuffle([1, 2, 3]); l3.colour = pick(['blue', 'orange']); l3.pos = { ...START3, d: 3 }; l3.prog = []; l3.setup = true; l3.msg = ''; render(); },
  l3face(a) { const l3 = S.l3; if (l3.running) return; l3.pos.d = +a; render(); },
  l3add(a) { const l3 = S.l3; if (l3.running || l3.prog.length >= 24) return; l3.prog.push(a); l3.msgType = ''; l3.msg = `${l3.prog.length} card${l3.prog.length > 1 ? 's' : ''} in your algorithm.`; render(); },
  l3remove(a) { const l3 = S.l3; if (l3.running) return; l3.prog.splice(+a, 1); render(); },
  l3clear() { S.l3.prog = []; render(); },
  l3toggle(a, e, t) { S.check = t.checked; },
  l3run() { if (S.check) { S.modal = { type: 'check' }; render(); } else runL3(); },
  l3go() { runL3(); },

  l4roll() { if (S.l4.phase === 'roll') rollL4(); },
  l4step(a) { const l4 = S.l4; if (l4.phase !== 'choose') return; const [x, y] = a.split(',').map(Number); l4.phase = 'moving'; l4.msg = ''; render(); stepL4(x, y); },
  l4show() { S.modal.shown = true; render(); },
  l4quiz(a) {
    const m = S.modal, l4 = S.l4;
    if (a === 'right') { l4.tokens[m.colour]++; l4.msg = `Correct! You won a ${m.colour} token.`; l4.msgType = 'good'; }
    else { l4.deck.push(m.id); l4.msg = (a === 'pass' ? 'You passed.' : 'Not this time.') + ' The card goes to the bottom of the deck. Roll again.'; l4.msgType = ''; }
    S.modal = null; l4.phase = 'roll'; render();
  },
  l4cont() { const l4 = S.l4; l4.phase = 'roll'; l4.msg = 'Roll the die.'; l4.msgType = ''; render(); },
  l4tele(a) { const l4 = S.l4, d = DOORS[a]; l4.pos = { x: d.x, y: d.y }; l4.prev = null; l4.phase = 'door'; l4.doorAt = a; l4.msg = `Whoosh! You are facing the ${a} door.`; render(); },
  l4knock(a) {
    const l4 = S.l4; if (!hasAll(l4) || l4.opened[a]) return;
    l4.tokens[a]--; l4.opened[a] = true; l4.phase = 'roll';
    if (a === S.ownerDoor) { S.done[3] = true; S.screen = 'win'; S.modal = null; render(); window.scrollTo(0, 0); return; }
    S.modal = { type: 'empty', colour: a }; l4.msg = `Not behind the ${a} door. Win more tokens and try another door.`; l4.msgType = ''; render();
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t.dataset.arg, e, t);
});

/* ---------- boot ---------- */
function start(data) {
  S = (data && data.S && data.S.v === 2) ? data.S : freshState();
  if (S.l3) S.l3.running = false;
  if (S.l4 && ['moving', 'rolling'].includes(S.l4.phase)) S.l4.phase = 'roll';
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
